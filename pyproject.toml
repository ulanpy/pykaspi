[project]
name = "pykaspi"
version = "0.1.0"
description = "Async Python client for Kaspi Pay POS private HTTP API"
readme = "README.md"
authors = [
    { name = "Ulan Sharipov", email = "ulan.sharipov@nu.edu.kz" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = [
    "kaspi",
    "kaspi-pay",
    "payments",
    "qr",
    "pos",
    "async",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "cryptography>=49.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.scripts]
pykaspi-terminal-init = "pykaspi.cli:main"

[project.urls]
Homepage = "https://github.com/ulanpy/pykaspi"
Repository = "https://github.com/ulanpy/pykaspi"
Issues = "https://github.com/ulanpy/pykaspi/issues"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
